<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Periodic Table</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --panel-bg: #1e293b;
            --border-radius: 8px;
            
            /* Category Colors */
            --alkali: #f87171;         /* Red-400 */
            --alkaline: #fb923c;       /* Orange-400 */
            --transition: #fbbf24;     /* Amber-400 */
            --post-transition: #a3e635;/* Lime-400 */
            --metalloid: #34d399;      /* Emerald-400 */
            --nonmetal: #2dd4bf;       /* Teal-400 */
            --noble: #38bdf8;          /* Sky-400 */
            --lanthanide: #c084fc;     /* Purple-400 */
            --actinide: #f472b6;       /* Pink-400 */
            --unknown: #94a3b8;        /* Slate-400 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1rem;
        }

        /* Top Info Panel */
        .info-panel {
            background-color: var(--panel-bg);
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 1000px;
            padding: 2rem;
            margin-bottom: 3rem;
            display: flex;
            align-items: flex-start;
            gap: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.05);
            height: 400px; /* Fixed height to allow scrolling inner content */
            transition: all 0.3s ease;
        }

        .info-square-container {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .info-square {
            width: 160px;
            height: 160px;
            border-radius: var(--border-radius);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #334155;
            color: var(--bg-color);
            box-shadow: inset 0 0 20px rgba(255,255,255,0.2);
            transition: background-color 0.3s ease;
            flex-shrink: 0;
        }

        .info-square .number { position: absolute; top: 10px; left: 12px; font-weight: 600; font-size: 1.3rem; }
        .info-square .mass { position: absolute; bottom: 10px; font-size: 0.9rem; font-weight: 500;}
        .info-square .symbol { font-size: 4rem; font-weight: 700; line-height: 1; }

        .info-details {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            padding-right: 1rem;
        }

        /* Custom Scrollbar for details */
        .info-details::-webkit-scrollbar { width: 8px; }
        .info-details::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        .info-details::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .info-details::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .info-details h2 { font-size: 2.2rem; margin-bottom: 0.2rem; line-height: 1.1; }
        
        .info-details .category {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            margin-top: 0.5rem;
            color: #000;
            background: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-details p.overview { color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }

        /* Structured Properties Grid */
        .properties-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .prop-section-title {
            grid-column: 1 / -1;
            font-size: 1.1rem;
            color: #38bdf8;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.3rem;
            font-weight: 500;
        }

        .prop-item {
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.2);
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .prop-label {
            color: #94a3b8;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.2rem;
        }

        .prop-val {
            color: #f8fafc;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* The Grid */
        .table-container {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 2rem;
            display: flex;
            justify-content: center;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, minmax(50px, 1fr));
            gap: 6px;
            position: relative;
        }

        /* Element styling */
        .element {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            background-color: #1e293b;
            color: #fff;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .element::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 6px;
            opacity: 0.15;
            z-index: 1;
            transition: opacity 0.2s ease;
        }

        .element:hover {
            transform: scale(1.15);
            z-index: 10;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
        }

        .element:hover::before {
            opacity: 0.4;
        }

        .el-number {
            position: absolute;
            top: 4px;
            left: 4px;
            font-size: 0.65rem;
            opacity: 0.8;
            z-index: 2;
        }

        .el-symbol {
            font-size: 1.2rem;
            font-weight: 600;
            z-index: 2;
        }

        .el-name {
            font-size: 0.5rem;
            opacity: 0.7;
            margin-top: 2px;
            z-index: 2;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            width: 90%;
            text-align: center;
        }

        /* Group Colors mapping classes */
        .alkali::before { background-color: var(--alkali); }
        .alkaline::before { background-color: var(--alkaline); }
        .transition::before { background-color: var(--transition); }
        .post-transition::before { background-color: var(--post-transition); }
        .metalloid::before { background-color: var(--metalloid); }
        .nonmetal::before { background-color: var(--nonmetal); }
        .noble::before { background-color: var(--noble); }
        .lanthanide::before { background-color: var(--lanthanide); }
        .actinide::before { background-color: var(--actinide); }
        .unknown::before { background-color: var(--unknown); }

        .element.active {
            transform: scale(1.15);
            z-index: 10;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        
        .element.active::before { opacity: 0.6; }

        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 3rem;
            max-width: 900px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        @media (max-width: 1024px) {
            .periodic-table {
                grid-template-columns: repeat(18, minmax(40px, 1fr));
            }
            .info-panel {
                flex-direction: column;
                height: auto;
                max-height: 80vh;
            }
            .info-square-container {
                position: relative;
                width: 100%;
                align-items: center;
            }
            .info-details {
                overflow-y: visible;
                padding-right: 0;
            }
        }
    </style>
</head>

                ionRadius: "140 pm (O²⁻)", covRadius: "73 pm", ionEnergy: "1313.9 kJ/mol", affinity: "141 kJ/mol", density: "1.429 g/L", 
                melt: "54.36 K", boil: "90.18 K", crystal: "Cubic", enthalpy: "0 kJ/mol", thermalCond: "0.0267 W/(m·K)", 
                electricalCond: "N/A", magnetic: "Paramagnetic", isotopes: "¹⁶O, ¹⁷O, ¹⁸O", abundance: "¹⁶O (99.76%)", 
                stability: "Stable", discovery: "1774", discoverer: "Priestley & Scheele", uses: "Respiration, combustion, steelmaking."
            }
        };

        // Engine to calculate missing data automatically based on scientific principles
        function generateElementDetails(data) {
            const [num, sym, name, cat, row, col, mass, fullCat] = data;
            const overrides = specificProperties[num] || {};

            // Calculate scientific baselines
            let block = 'd';
            if (col <= 2) block = 's';
            else if (col >= 13) block = 'p';
            if (num === 2) block = 's'; // Helium exception
            if ((num >= 57 && num <= 71) || (num >= 89 && num <= 103)) block = 'f';

            const stateArrGas = [1, 2, 7, 8, 9, 10, 17, 18, 36, 54, 86]; // Gases
            const stateArrLiq = [35, 80]; // Br, Hg
            let state = "Solid";
            if (stateArrGas.includes(num)) state = "Gas";
            if (stateArrLiq.includes(num)) state = "Liquid";
            if (num > 103) state = "Unknown (Predicted Solid)";

            const occurrence = (num >= 95 || num === 43 || num === 61) ? "Synthetic" : "Primordial (Natural)";
            
            // Build the comprehensive 35 property object
            return {
                // 1. General Info
                name: name,
                symbol: sym,
                num: num,
                mass: mass,
                period: row > 7 ? (row === 9 ? 6 : 7) : row,
                group: (col === 3 && row > 7) ? 'N/A (f-block)' : col,
                block: block,
                category: fullCat,

                // 2. Atomic Particles
                protons: num,
                electrons: num,
                neutrons: Math.round(mass) - num,
                isotopes: overrides.isotopes || "Various",
                abundance: overrides.abundance || "Varies",
                stability: overrides.stability || (num > 82 ? "Radioactive" : "Stable isotopes exist"),

                // 3. Electronic Structure
                eConfig: overrides.eConfig || "Available in full DB",
                valence: overrides.valence || (col > 12 ? col - 10 : (col > 2 ? "Varies" : col)),
                oxStates: overrides.oxStates || "Varies",
                electronegativity: overrides.electronegativity || "Varies",
                ionEnergy: overrides.ionEnergy || "Varies",
                affinity: overrides.affinity || "Varies",

                // 4. Physical Properties
                state: state,
                density: overrides.density || "Varies depending on allotrope",
                melt: overrides.melt || (state === "Gas" ? "Very Low" : "Varies"),
                boil: overrides.boil || (state === "Gas" ? "Low" : "Varies"),
                crystal: overrides.crystal || "Varies",
                radius: overrides.radius || "Varies (Periodic Trend)",
                ionRadius: overrides.ionRadius || "Depends on charge",
                covRadius: overrides.covRadius || "Varies",

                // 5. Thermodynamic & Electromagnetic
                enthalpy: overrides.enthalpy || "Varies",
                thermalCond: overrides.thermalCond || "Varies",
                electricalCond: overrides.electricalCond || (cat.includes('metal') ? "Good Conductor" : "Poor Conductor"),
                magnetic: overrides.magnetic || "Varies",

                // 6. History & Uses
                discovery: overrides.discovery || "Various/Historical",
                discoverer: overrides.discoverer || "Various scientists",
                occurrence: occurrence,
                uses: overrides.uses || `Research and specific ${fullCat.toLowerCase()} applications.`
            };
        }

        const tableContainer = document.getElementById('table');

        // Draw Empty Placemarkers for Lanthanides/Actinides
        const placeholders = [
            { row: 6, col: 3, text: "57-71" },
            { row: 7, col: 3, text: "89-103" }
        ];

        placeholders.forEach(ph => {
            const div = document.createElement('div');
            div.style.gridRow = ph.row;
            div.style.gridColumn = ph.col;
            div.style.display = 'flex';
            div.style.alignItems = 'center';
            div.style.justifyContent = 'center';
            div.style.fontSize = '0.7rem';
            div.style.color = '#94a3b8';
            div.innerText = ph.text;
            tableContainer.appendChild(div);
        });

        let activeElDiv = null;

        // Render Elements
        elementsData.forEach(data => {
            const el = document.createElement('div');
            el.className = `element ${data[3]}`;
            el.style.gridRow = data[4];
            el.style.gridColumn = data[5];
            
            el.innerHTML = `
                <span class="el-number">${data[0]}</span>
                <span class="el-symbol">${data[1]}</span>
                <span class="el-name">${data[2]}</span>
            `;

            const updatePanel = () => {
                if(activeElDiv) activeElDiv.classList.remove('active');
                el.classList.add('active');
                activeElDiv = el;

                const props = generateElementDetails(data);

                // Update Overview Sidebar
                document.getElementById('info-num').innerText = props.num;
                document.getElementById('info-sym').innerText = props.symbol;
                document.getElementById('info-name').innerText = props.name;
                document.getElementById('info-mass').innerText = props.mass;
                
                const catEl = document.getElementById('info-cat');
                catEl.innerText = props.category;
                
                const colorVar = `var(--${data[3]})`;
                document.getElementById('info-square').style.backgroundColor = colorVar;
                catEl.style.backgroundColor = colorVar;

                document.getElementById('info-desc').innerHTML = `<strong>${props.name}</strong> is a ${props.category.toLowerCase()} located in Period ${props.period}, Group ${props.group}. Explore all 35 properties below.`;

                // Build the properties grid
                const propGridHTML = `
                    <div class="properties-container">
                        <div class="prop-section-title">General & Location</div>
                        <div class="prop-item"><span class="prop-label">Period / Group</span><span class="prop-val">Period ${props.period}, Group ${props.group}</span></div>
                        <div class="prop-item"><span class="prop-label">Block</span><span class="prop-val">${props.block}-block</span></div>
                        <div class="prop-item"><span class="prop-label">Atomic Mass</span><span class="prop-val">${props.mass} u</span></div>
                        
                        <div class="prop-section-title">Atomic Particles</div>
                        <div class="prop-item"><span class="prop-label">Protons (Z)</span><span class="prop-val">${props.protons}</span></div>
                        <div class="prop-item"><span class="prop-label">Electrons</span><span class="prop-val">${props.electrons}</span></div>
                        <div class="prop-item"><span class="prop-label">Neutrons (Avg)</span><span class="prop-val">${props.neutrons}</span></div>
                        <div class="prop-item"><span class="prop-label">Isotopes</span><span class="prop-val">${props.isotopes}</span></div>
                        <div class="prop-item"><span class="prop-label">Abundance</span><span class="prop-val">${props.abundance}</span></div>
                        <div class="prop-item"><span class="prop-label">Nuclear Stability</span><span class="prop-val">${props.stability}</span></div>

                        <div class="prop-section-title">Electronic Structure</div>
                        <div class="prop-item"><span class="prop-label">Electron Config</span><span class="prop-val">${props.eConfig}</span></div>
                        <div class="prop-item"><span class="prop-label">Valence Electrons</span><span class="prop-val">${props.valence}</span></div>
                        <div class="prop-item"><span class="prop-label">Oxidation States</span><span class="prop-val">${props.oxStates}</span></div>
                        <div class="prop-item"><span class="prop-label">Electronegativity</span><span class="prop-val">${props.electronegativity}</span></div>
                        <div class="prop-item"><span class="prop-label">Ionization Energy</span><span class="prop-val">${props.ionEnergy}</span></div>
                        <div class="prop-item"><span class="prop-label">Electron Affinity</span><span class="prop-val">${props.affinity}</span></div>

                        <div class="prop-section-title">Physical Properties</div>
                        <div class="prop-item"><span class="prop-label">State (20°C)</span><span class="prop-val">${props.state}</span></div>
                        <div class="prop-item"><span class="prop-label">Density</span><span class="prop-val">${props.density}</span></div>
                        <div class="prop-item"><span class="prop-label">Melting Point</span><span class="prop-val">${props.melt}</span></div>
                        <div class="prop-item"><span class="prop-label">Boiling Point</span><span class="prop-val">${props.boil}</span></div>
                        <div class="prop-item"><span class="prop-label">Crystal Structure</span><span class="prop-val">${props.crystal}</span></div>
                        <div class="prop-item"><span class="prop-label">Atomic Radius</span><span class="prop-val">${props.radius}</span></div>
                        <div class="prop-item"><span class="prop-label">Ionic Radius</span><span class="prop-val">${props.ionRadius}</span></div>
                        <div class="prop-item"><span class="prop-label">Covalent Radius</span><span class="prop-val">${props.covRadius}</span></div>

                        <div class="prop-section-title">Thermodynamic & Electromagnetic</div>
                        <div class="prop-item"><span class="prop-label">Standard Enthalpy</span><span class="prop-val">${props.enthalpy}</span></div>
                        <div class="prop-item"><span class="prop-label">Thermal Cond.</span><span class="prop-val">${props.thermalCond}</span></div>
                        <div class="prop-item"><span class="prop-label">Electrical Cond.</span><span class="prop-val">${props.electricalCond}</span></div>
                        <div class="prop-item"><span class="prop-label">Magnetic Props</span><span class="prop-val">${props.magnetic}</span></div>

                        <div class="prop-section-title">History & Application</div>
                        <div class="prop-item"><span class="prop-label">Discovery Year</span><span class="prop-val">${props.discovery}</span></div>
                        <div class="prop-item"><span class="prop-label">Discoverer</span><span class="prop-val">${props.discoverer}</span></div>
                        <div class="prop-item"><span class="prop-label">Occurrence</span><span class="prop-val">${props.occurrence}</span></div>
                        <div class="prop-item" style="grid-column: 1 / -1;"><span class="prop-label">Main Uses</span><span class="prop-val">${props.uses}</span></div>
                    </div>
                `;

                document.getElementById('dynamic-properties').innerHTML = propGridHTML;
                
                // Reset scroll to top of details area when a new element is clicked
                document.getElementById('info-scroll-area').scrollTop = 0;
            };

            el.addEventListener('mouseenter', updatePanel);
            el.addEventListener('click', updatePanel);

            tableContainer.appendChild(el);
        });

        // Create Legend dynamically
        const categories = [
            { id: 'alkali', name: 'Alkali Metal' },
            { id: 'alkaline', name: 'Alkaline Earth Metal' },
            { id: 'transition', name: 'Transition Metal' },
            { id: 'post-transition', name: 'Post-transition Metal' },
            { id: 'metalloid', name: 'Metalloid' },
            { id: 'nonmetal', name: 'Reactive Nonmetal' },
            { id: 'noble', name: 'Noble Gas' },
            { id: 'lanthanide', name: 'Lanthanide' },
            { id: 'actinide', name: 'Actinide' },
            { id: 'unknown', name: 'Unknown Properties' },
        ];

        const legendContainer = document.getElementById('legend');
        categories.forEach(cat => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `
                <div class="legend-color" style="background-color: var(--${cat.id})"></div>
                <span>${cat.name}</span>
            `;
            legendContainer.appendChild(item);
        });
    </script>
</body>
</html>
